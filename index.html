<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Laws of Guyana · full‑page viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>
<div class="app-container">
    <div class="header" id="searchHeader">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search laws...">
        </div>
    </div>

    <div class="back-bar" id="backBar">
        <button class="btn-back" id="backButton">
            <i class="fas fa-arrow-left"></i> Back to chapters
        </button>
    </div>

    <div class="list-container" id="listContainer">
        <div class="list-header">
            <span><i class="fas fa-list"></i> Chapters</span>
            <span id="itemCount"></span>
        </div>
        <div class="list-scroll" id="listScroll">
        </div>
        <div class="no-results" id="noResults">
            <i class="fas fa-search"></i>
            <p>No chapters match your search.</p>
        </div>
    </div>

    <div class="pdf-viewer" id="pdfViewer">
        <div class="pdf-header">
            <div class="title" id="pdfTitle">
                <i class="fas fa-file-pdf"></i>
                <span>Chapter</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span class="readonly-badge"><i class="fas fa-lock"></i> Read‑only</span>
                <span><i class="fas fa-file"></i> PDF</span>
            </div>
        </div>
        <div class="pdf-frame-container">
            <iframe class="pdf-frame" id="pdfFrame" src="about:blank" title="PDF viewer (read-only)"></iframe>
        </div>
    </div>
</div>

<script type="text/javascript" src="javascript/index.js" ></script>
</body>
</html>
